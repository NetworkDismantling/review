# ============================================================================
# Network Dismantling Framework - Pixi Configuration
# ============================================================================
# This configuration manages conda dependencies for the Network Dismantling 
# framework. PyTorch and PyTorch Geometric are installed separately via 
# dynamic detection to handle different CUDA versions correctly.
#
# Complete Setup Workflow:
#   1. pixi install                    # Install conda dependencies
#   2. pixi run setup-pytorch          # Auto-detect CUDA and install PyTorch/PyG
#   3. pixi run install-local          # Compile and install local package
#
# Or use the all-in-one command:
#   pixi run setup-all
# ============================================================================

[workspace]
name = "network-dismantling"
authors = ["Marco Grassia <666024+eMarco@users.noreply.github.com>"]
channels = ["conda-forge"]
homepage = "https://github.com/NetworkDismantling/review/"
repository = "https://github.com/NetworkDismantling/review/"
documentation = "https://github.com/NetworkDismantling/review/"
readme = "README.md"
version = "0.1.0"

platforms = ["osx-arm64", "linux-64"]

# ============================================================================
# Common Dependencies (all environments)
# ============================================================================

[dependencies]
# Core Python packages
pip = ">=26.0.1"
python = ">=3.12,<3.14"

# Data Science Stack
pandas = ">=3.0.0"
numpy = ">=2.4.2"
scipy = ">=1.17.0,<2"
matplotlib = ">=3.10.8"
seaborn = ">=0.13.2"
pandas-stubs = ">=3.0.0.260204"

# Utilities
tqdm = ">=4.67.3"
dill = ">=0.4.1,<0.5"
parse = ">=1.21.0,<2"

# Data formats
pyarrow = ">=23.0.0,<24"
fastparquet = ">=2025.12.0,<2026"

# Jupyter
ipywidgets = ">=8.1.8"
jupyter = ">=1.1.1"
jupyterlab = ">=4.5.3"

# Graph-tool (conda-only, reason we use Pixi!)
graph-tool = ">=2.95"
libboost = ">=1.86.0"
libboost-devel = ">=1.86.0"
libboost-headers = ">=1.86.0"
libboost-python = ">=1.86.0"
libboost-python-devel = ">=1.86.0"

# Build tools
cmake = ">=4.2.1"

# Testing
pytest = ">=9.0.2"

# IDE integration
pixi-pycharm = ">=0.0.10,<0.0.11"

# ============================================================================
# PyPI Dependencies
# ============================================================================

[pypi-dependencies]
# PyPI-only packages
deadpool-executor = ">=2025.2.2"

# NOTE: PyTorch and PyTorch Geometric are NOT installed here!
# They are installed dynamically via: pixi run setup-pytorch
# This allows automatic detection of CUDA version and installation of 
# the correct wheels without hardcoding versions.

# NOTE: Local package (NetworkDismantling) is NOT installed here!
# It must be installed AFTER the environment is ready using: pixi run install-local
# This is because setup.py requires graph-tool, Boost, and other conda dependencies
# to be available in an activated environment (CONDA_PREFIX must be set for Makefiles).

# ============================================================================
# Tasks
# ============================================================================

[tasks]
# === Setup Tasks (run after pixi install) ===

# Step 1: Install PyTorch and PyG with automatic CUDA detection
setup-pytorch = { cmd = "python setup_pytorch.py", description = "Auto-detect CUDA and install PyTorch/PyG" }

# Step 2: Compile and install local package (requires activated environment)
install-local = { cmd = "pip install -e . --no-build-isolation", description = "Install NetworkDismantling package" }
install-local-clean = { cmd = "pip install -e . --no-build-isolation --force-reinstall", description = "Reinstall NetworkDismantling package" }

# All-in-one setup (recommended for first-time setup)
setup-all = { cmd = "python setup_pytorch.py && pip install -e . --no-build-isolation", description = "Complete setup: PyTorch + local package" }

# === Testing ===
test = "python -m pytest tests/ -v"
test-verbose = "python -m pytest tests/ -v -s"
test-quick = "python -m pytest tests/ -v -x"

# === Jupyter ===
jupyter = "jupyter lab"
notebook = "jupyter notebook"

# === Environment Info ===
info = { cmd = "python -c \"import sys; print(f'Python: {sys.version}'); import torch; print(f'PyTorch: {torch.__version__}'); print(f'CUDA available: {torch.cuda.is_available()}'); print(f'CUDA version: {torch.version.cuda if torch.cuda.is_available() else None}'); import torch_geometric; print(f'PyG: {torch_geometric.__version__}')\"", description = "Show environment information" }
verify = { cmd = "python verify_env.py", description = "Verify environment setup" }

# === Maintenance ===
clean-cache = "rm -rf .pixi/envs/*/lib/python*/site-packages/__pycache__"
clean-build = { cmd = "find . -name '*.o' -delete && find . -name '*.so' -delete && find network_dismantling -type d -name build -exec rm -rf {} + 2>/dev/null || true", description = "Clean compiled artifacts" }

